<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Input & Rekap Nilai Siswa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .badge-3 { background-color: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .badge-2 { background-color: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
    .badge-1 { background-color: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
  </style>
</head>
<body class="text-slate-800 pb-16">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div>
        <h1 class="text-lg sm:text-xl font-bold flex items-center gap-2">
          <i class="fa-solid fa-table-list"></i> Panel Input & Rekap Nilai Siswa
        </h1>
        <p class="text-xs text-indigo-200 mt-0.5">Tersinkronisasi langsung dengan Google Spreadsheet</p>
      </div>
      <div class="flex items-center gap-2">
        <span id="syncStatus" class="text-xs bg-indigo-800 px-3 py-1.5 rounded-full flex items-center gap-1.5">
          <i class="fa-solid fa-circle-check text-emerald-400"></i> Terhubung
        </span>
        <button onclick="fetchData()" class="bg-white/15 hover:bg-white/25 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-rotate"></i> Refresh
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-6">
    
    <!-- Panel Kontrol: Pencarian, Filter Kelas & Tombol Copy -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-5">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end">
        
        <!-- Pencarian -->
        <div class="md:col-span-5">
          <label class="block text-xs font-semibold text-slate-600 mb-1">Cari Siswa (Nama / NIS / NISN)</label>
          <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
            <input type="text" id="searchInput" onkeyup="filterData()" placeholder="Ketik nama atau nomor induk..." 
              class="w-full pl-9 pr-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
          </div>
        </div>

        <!-- Filter Kelas -->
        <div class="md:col-span-3">
          <label class="block text-xs font-semibold text-slate-600 mb-1">Filter Kelas</label>
          <select id="kelasFilter" onchange="filterData()" 
            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
            <option value="">Semua Kelas</option>
          </select>
        </div>

        <!-- Tombol Copy -->
        <div class="md:col-span-4 flex flex-wrap sm:flex-nowrap gap-2">
          <button onclick="copyNames()" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold py-2.5 px-3 rounded-lg transition flex items-center justify-center gap-1.5 shadow-sm cursor-pointer">
            <i class="fa-regular fa-copy"></i> Copy Nama Siswa
          </button>
          <button onclick="copyScores()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2.5 px-3 rounded-lg transition flex items-center justify-center gap-1.5 shadow-sm cursor-pointer">
            <i class="fa-solid fa-clipboard-check"></i> Copy Nilai Saja
          </button>
        </div>
      </div>

      <!-- Info Jumlah Data -->
      <div class="mt-3 pt-3 border-t border-slate-100 flex flex-wrap justify-between items-center text-xs text-slate-500 gap-2">
        <span>Menampilkan <strong id="countShown" class="text-slate-800">0</strong> dari <strong id="countTotal" class="text-slate-800">0</strong> siswa</span>
        <span class="text-slate-400 italic">*Fitur Copy menyalin daftar sesuai filter yang sedang tampil</span>
      </div>
    </div>

    <!-- Tabel Data -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-100 text-slate-600 text-xs uppercase tracking-wider border-b border-slate-200">
              <th class="py-3 px-4 font-semibold w-12 text-center">No</th>
              <th class="py-3 px-4 font-semibold">NIS / NISN</th>
              <th class="py-3 px-4 font-semibold">Nama Lengkap</th>
              <th class="py-3 px-4 font-semibold text-center">Kelas</th>
              <th class="py-3 px-4 font-semibold text-center w-32">Nilai</th>
              <th class="py-3 px-4 font-semibold w-40">Keterangan</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-200 text-sm">
            <tr>
              <td colspan="6" class="py-10 text-center text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-xl mb-2 text-indigo-600"></i>
                <p>Memuat data dari Spreadsheet...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Toast Notifikasi -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs font-medium px-4 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-2">
    <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMsg">Berhasil disalin!</span>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxaKU2psI4KuJJjR1vafzv__-Z3eltsK9m3Sy3EVkKwxzKdj5UsMWAJsi-KYb5MHu9wBQ/exec";

    let allData = [];
    let filteredData = [];

    // Konversi nilai ke keterangan otomatis
    function getKeterangan(nilai) {
      if (nilai === "3") return "Sangat Bagus";
      if (nilai === "2") return "Bagus";
      if (nilai === "1") return "Cukup";
      return "";
    }

    // Ambil data saat halaman dibuka
    window.onload = () => {
      fetchData();
    };

    async function fetchData() {
      setSyncStatus('loading', 'Memuat data...');
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify({ action: 'getData' })
        });
        const result = await response.json();
        
        if (result.status === 'success') {
          allData = result.data;
          populateKelasDropdown();
          filterData();
          setSyncStatus('success', 'Tersinkronisasi');
        } else {
          showToast('Gagal memuat data: ' + result.message, true);
          setSyncStatus('error', 'Gagal Sinkron');
        }
      } catch (err) {
        console.error(err);
        showToast('Koneksi gagal. Periksa izin akses Apps Script.', true);
        setSyncStatus('error', 'Offline');
      }
    }

    // Isi opsi filter kelas unik secara otomatis
    function populateKelasDropdown() {
      const kelasSelect = document.getElementById('kelasFilter');
      const currentVal = kelasSelect.value;
      const kelasSet = [...new Set(allData.map(item => item.kelas).filter(Boolean))].sort();
      
      kelasSelect.innerHTML = '<option value="">Semua Kelas</option>';
      kelasSet.forEach(kls => {
        const opt = document.createElement('option');
        opt.value = kls;
        opt.textContent = kls;
        kelasSelect.appendChild(opt);
      });
      kelasSelect.value = currentVal;
    }

    // Filter data berdasarkan pencarian & kelas
    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const kelas = document.getElementById('kelasFilter').value;

      filteredData = allData.filter(item => {
        const matchKelas = kelas === "" || item.kelas === kelas;
        const matchQuery = 
          String(item.nama).toLowerCase().includes(query) ||
          String(item.nis).toLowerCase().includes(query) ||
          String(item.nisn).toLowerCase().includes(query);
        return matchKelas && matchQuery;
      });

      document.getElementById('countShown').textContent = filteredData.length;
      document.getElementById('countTotal').textContent = allData.length;
      renderTable();
    }

    // Render baris tabel
    function renderTable() {
      const tbody = document.getElementById('tableBody');
      if (filteredData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400">Data siswa tidak ditemukan.</td></tr>`;
        return;
      }

      tbody.innerHTML = filteredData.map((item, idx) => {
        const ketText = item.ket || getKeterangan(item.nilai);
        let badgeClass = "text-slate-400 italic";
        if (item.nilai === "3") badgeClass = "badge-3 font-semibold px-2.5 py-1 rounded-full text-xs inline-block";
        else if (item.nilai === "2") badgeClass = "badge-2 font-semibold px-2.5 py-1 rounded-full text-xs inline-block";
        else if (item.nilai === "1") badgeClass = "badge-1 font-semibold px-2.5 py-1 rounded-full text-xs inline-block";

        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="py-3 px-4 text-center text-slate-500 font-medium">${item.no || (idx + 1)}</td>
            <td class="py-3 px-4">
              <div class="font-medium text-slate-700">${item.nis || '-'}</div>
              <div class="text-xs text-slate-400">${item.nisn || '-'}</div>
            </td>
            <td class="py-3 px-4 font-semibold text-slate-800">${item.nama}</td>
            <td class="py-3 px-4 text-center">
              <span class="bg-slate-100 text-slate-700 text-xs font-semibold px-2.5 py-1 rounded-md border border-slate-200">${item.kelas}</span>
            </td>
            <td class="py-3 px-4 text-center">
              <select onchange="handleNilaiChange(${item.rowNumber}, this.value)" 
                class="w-24 px-2 py-1.5 text-sm font-semibold border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white cursor-pointer">
                <option value="" ${item.nilai === "" ? "selected" : ""}>- Pilih -</option>
                <option value="3" ${item.nilai === "3" ? "selected" : ""}>3</option>
                <option value="2" ${item.nilai === "2" ? "selected" : ""}>2</option>
                <option value="1" ${item.nilai === "1" ? "selected" : ""}>1</option>
              </select>
            </td>
            <td class="py-3 px-4">
              <span id="ket-${item.rowNumber}" class="${badgeClass}">${ketText || 'Belum dinilai'}</span>
            </td>
          </tr>
        `;
      }).join('');
    }

    // Saat dropdown nilai diubah -> Update UI instan & kirim ke Spreadsheet
    async function handleNilaiChange(rowNumber, newNilai) {
      const newKet = getKeterangan(newNilai);
      
      // Update state lokal
      const targetIndex = allData.findIndex(d => d.rowNumber === rowNumber);
      if (targetIndex !== -1) {
        allData[targetIndex].nilai = newNilai;
        allData[targetIndex].ket = newKet;
      }

      // Update tampilan kolom Keterangan secara instan
      const ketEl = document.getElementById(`ket-${rowNumber}`);
      if (ketEl) {
        ketEl.textContent = newKet || 'Belum dinilai';
        ketEl.className = newNilai === "3" ? "badge-3 font-semibold px-2.5 py-1 rounded-full text-xs inline-block" :
                          newNilai === "2" ? "badge-2 font-semibold px-2.5 py-1 rounded-full text-xs inline-block" :
                          newNilai === "1" ? "badge-1 font-semibold px-2.5 py-1 rounded-full text-xs inline-block" :
                          "text-slate-400 italic";
      }

      // Sinkronisasi ke Google Sheets di latar belakang
      setSyncStatus('loading', 'Menyimpan...');
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify({
            action: 'updateNilai',
            rowNumber: rowNumber,
            nilai: newNilai,
            ket: newKet
          })
        });
        const result = await res.json();
        if (result.status === 'success') {
          setSyncStatus('success', 'Tersimpan');
          showToast(`Nilai (${newNilai || 'Kosong'}) & Ket (${newKet || '-'}) tersimpan!`);
        } else {
          setSyncStatus('error', 'Gagal simpan');
          showToast('Gagal menyimpan ke Spreadsheet', true);
        }
      } catch (err) {
        setSyncStatus('error', 'Error');
        showToast('Terjadi kesalahan jaringan saat menyimpan', true);
      }
    }

    // Copy Nama Siswa saja (sesuai hasil filter)
    function copyNames() {
      if (filteredData.length === 0) return showToast('Tidak ada data untuk disalin', true);
      const textToCopy = filteredData.map(item => item.nama).join('\n');
      navigator.clipboard.writeText(textToCopy).then(() => {
        showToast(`${filteredData.length} Nama Siswa berhasil disalin!`);
      });
    }

    // Copy Nilai saja (sesuai hasil filter)
    function copyScores() {
      if (filteredData.length === 0) return showToast('Tidak ada data untuk disalin', true);
      const textToCopy = filteredData.map(item => item.nilai || '').join('\n');
      navigator.clipboard.writeText(textToCopy).then(() => {
        showToast(`${filteredData.length} Baris Nilai berhasil disalin!`);
      });
    }

    // Indikator status sinkronisasi
    function setSyncStatus(state, text) {
      const el = document.getElementById('syncStatus');
      if (state === 'loading') {
        el.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-amber-300"></i> ${text}`;
      } else if (state === 'success') {
        el.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> ${text}`;
      } else {
        el.innerHTML = `<i class="fa-solid fa-circle-exclamation text-rose-400"></i> ${text}`;
      }
    }

    // Pop-up Toast notifikasi
    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toastIcon');
      document.getElementById('toastMsg').textContent = msg;
      
      icon.className = isError ? 'fa-solid fa-circle-exclamation text-rose-400' : 'fa-solid fa-circle-check text-emerald-400';
      toast.classList.remove('translate-y-20', 'opacity-0');
      
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2800);
    }
  </script>
</body>
</html>
